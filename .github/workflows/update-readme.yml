name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:     # Manual trigger in Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch latest HEADSPACE post
        id: blog
        run: |
          curl -s https://alifnaufal.me/index.xml | python3 << 'EOF'
import sys, xml.etree.ElementTree as ET
from datetime import datetime

tree = ET.parse(sys.stdin)
root = tree.getroot()
items = root.findall('.//item')

if items:
    item = items[0]
    title = item.find('title').text
    link = item.find('link').text
    pubDate = item.find('pubDate').text
    
    # Parse and format date
    date_obj = datetime.strptime(pubDate, '%a, %d %b %Y %H:%M:%S %z')
    formatted_date = date_obj.strftime('%b %d, %Y')
    
    print(f"BLOG_TITLE={title}")
    print(f"BLOG_LINK={link}")
    print(f"BLOG_DATE={formatted_date}")
else:
    print("BLOG_TITLE=No posts yet")
    print("BLOG_LINK=#")
    print("BLOG_DATE=")
EOF
        
      - name: Get language stats
        id: langs
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/n6ufal/repos | python3 << 'PYSCRIPT'
import sys, json

repos = json.load(sys.stdin)
langs = {}

for repo in repos:
    if repo.get('language'):
        langs[repo['language']] = langs.get(repo['language'], 0) + 1

if langs:
    top = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:5]
    langs_str = ', '.join([lang for lang, count in top])
else:
    langs_str = "No language data yet"

print(f"TOP_LANGS={langs_str}")
PYSCRIPT
      
      - name: Update README
        env:
          BLOG_TITLE: ${{ steps.blog.outputs.BLOG_TITLE }}
          BLOG_LINK: ${{ steps.blog.outputs.BLOG_LINK }}
          BLOG_DATE: ${{ steps.blog.outputs.BLOG_DATE }}
          TOP_LANGS: ${{ steps.langs.outputs.TOP_LANGS }}
        run: |
          python3 << 'SCRIPT'
import os, re

with open('README.md', 'r') as f:
    content = f.read()

# Update blog section
blog_title = os.getenv('BLOG_TITLE', 'No posts')
blog_link = os.getenv('BLOG_LINK', '#')
blog_date = os.getenv('BLOG_DATE', '')
blog_line = f"[{blog_title}]({blog_link})" + (f" — {blog_date}" if blog_date else "")

content = re.sub(
    r'(<!-- blog-start -->).*?(<!-- blog-end -->)',
    rf'\1\n{blog_line}\n\2',
    content,
    flags=re.DOTALL
)

# Update languages section
langs = os.getenv('TOP_LANGS', 'Fetching...')
content = re.sub(
    r'(<!-- langs-start -->).*?(<!-- langs-end -->)',
    rf'\1\n{langs}\n\2',
    content,
    flags=re.DOTALL
)

with open('README.md', 'w') as f:
    f.write(content)
SCRIPT
      
      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update readme with latest post and languages" && git push)
