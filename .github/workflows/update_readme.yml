name: Update README to fetch HEADSPACE
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS feed
        run: curl -s https://alifnaufal.me/index.xml > feed.xml
      - name: Fetch latest HEADSPACE post
        id: blog
        run: python3 scripts/fetch_blog.py >> $GITHUB_OUTPUT
      - name: Fetch GitHub repos
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/n6ufal/repos?per_page=100" > repos.json
      - name: Get language stats
        id: langs
        run: python3 scripts/fetch_langs.py >> $GITHUB_OUTPUT
      - name: Update README
        env:
          BLOG_TITLE_1: ${{ steps.blog.outputs.BLOG_TITLE_1 }}
          BLOG_LINK_1: ${{ steps.blog.outputs.BLOG_LINK_1 }}
          BLOG_DATE_1: ${{ steps.blog.outputs.BLOG_DATE_1 }}
          BLOG_TITLE_2: ${{ steps.blog.outputs.BLOG_TITLE_2 }}
          BLOG_LINK_2: ${{ steps.blog.outputs.BLOG_LINK_2 }}
          BLOG_DATE_2: ${{ steps.blog.outputs.BLOG_DATE_2 }}
          BLOG_TITLE_3: ${{ steps.blog.outputs.BLOG_TITLE_3 }}
          BLOG_LINK_3: ${{ steps.blog.outputs.BLOG_LINK_3 }}
          BLOG_DATE_3: ${{ steps.blog.outputs.BLOG_DATE_3 }}
          TOP_LANGS: ${{ steps.langs.outputs.TOP_LANGS }}
        run: python3 scripts/update_readme.py
      - name: Debug README
        run: cat README.md
      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update readme" &&
            git pull --rebase origin main &&
            git push
          )